<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>BobilSync</title>

    <style>
        :root {
            --glass: linear-gradient(135deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .04));
            --edge: rgba(255, 255, 255, .2);
            --fg: #f4f2fb;
            --dim: rgba(244, 242, 251, .6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            height: 100%;
            background: #05040a;
            color: var(--fg);
            overflow: hidden;
            font: 300 14px/1.4 "Avenir Next", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body>canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        [v-cloak] {
            display: none;
        }

        .ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            transition: opacity .6s;
            padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
        }

        .ui.idle {
            opacity: 0;
        }

        .ui.idle * {
            cursor: none;
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(170%);
            -webkit-backdrop-filter: blur(24px) saturate(170%);
            border: 1px solid var(--edge);
            border-radius: 22px;
            pointer-events: auto;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -1px 0 rgba(255, 255, 255, .05), 0 12px 40px rgba(0, 0, 0, .35);
        }

        .top {
            position: absolute;
            left: 18px;
            top: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            max-width: min(60vw, 420px);
        }

        .brand {
            padding: 10px 20px;
            font-weight: 200;
            letter-spacing: .34em;
            font-size: 15px;
        }

        .status {
            padding: 8px 16px;
            color: var(--dim);
            font-size: 13px;
            border-radius: 999px;
        }

        .meter {
            position: absolute;
            right: 18px;
            top: 18px;
            width: 188px;
            padding: 12px;
            text-align: center;
        }

        .meter svg {
            width: 100%;
            display: block;
        }

        .meter .bar {
            stroke-width: 2.4;
            stroke-linecap: round;
        }

        .meter .ring {
            fill: none;
            stroke: #fff;
            stroke-width: 1;
        }

        .bpm {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-62%);
            pointer-events: none;
        }

        .bpm b {
            display: block;
            font-weight: 200;
            font-size: 34px;
            font-variant-numeric: tabular-nums;
        }

        .bpm span {
            font-size: 11px;
            color: var(--dim);
            letter-spacing: .2em;
        }

        .tw {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .dock {
            position: absolute;
            left: max(18px, env(safe-area-inset-left));
            bottom: max(18px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
            padding: 10px;
            border-radius: 22px;
            width: 260px;
            max-width: min(320px, calc(100vw - 36px));
            max-height: min(68vh, 620px);
        }

        .dock-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 6px;
            flex: none;
        }

        .visual-options {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            overscroll-behavior: contain;
            min-height: 0;
            max-height: min(48vh, 420px);
            width: 100%;
            padding: 8px 3px 2px 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, .32) transparent;
            border-top: 1px solid var(--edge);
        }

        .visual-options-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 4px 4px 8px 8px;
            position: sticky;
            top: -8px;
            z-index: 1;
            background: rgba(18, 16, 25, .96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--edge);
            margin-bottom: 3px;
        }

        .visual-options-title {
            font-size: 11px;
            opacity: .65;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .visual-options .close-select {
            width: 28px;
            min-width: 28px;
            height: 28px;
            padding: 0;
            border: 1px solid var(--edge);
            background: rgba(255, 255, 255, .06);
            text-align: center;
            font-size: 19px;
            line-height: 1;
        }

        .select-button {
            min-width: 100px;
        }

        .dock {
            z-index: 5;
        }

        .dock-controls>button {
            padding: 8px 11px;
        }

        .visual-options button {
            width: 100%;
            text-align: left;
            border-radius: 12px;
            padding: 9px 12px;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, .025);
            font-size: 13px;
            letter-spacing: .015em;
        }

        .visual-options button:hover {
            background: rgba(255, 255, 255, .09);
        }

        .visual-options button.on {
            background: linear-gradient(110deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .07));
            border-color: var(--edge);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 0 18px rgba(180, 145, 255, .07);
        }

        .dock .br {
            display: none;
        }

        @media (max-height: 600px) {
            .dock {
                max-height: 54vh;
            }
        }

        .br {
            flex-basis: 100%;
            height: 1px;
            background: var(--edge);
            margin: 2px 10px;
        }

        .tabs button {
            letter-spacing: .14em;
            font-size: 12px;
            text-transform: uppercase;
        }

        .panel {
            position: absolute;
            left: 18px;
            top: 112px;
            width: 250px;
            padding: 16px 18px;
        }

        .panel h3 {
            font-weight: 300;
            font-size: 13px;
            color: var(--dim);
            margin-bottom: 10px;
        }

        .sw {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .swatch {
            width: 34px;
            height: 34px;
            padding: 0;
            border: 2px solid transparent;
        }

        .swatch.on {
            border-color: #fff;
        }

        .panel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 12px;
        }

        .panel input[type=range] {
            width: 100%;
            accent-color: #fff;
            margin-top: 6px;
        }

        button {
            font: inherit;
            color: var(--fg);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 8px 16px;
            cursor: pointer;
            white-space: nowrap;
            flex: none;
            transition: background .25s, border-color .25s;
        }

        button:hover {
            background: rgba(255, 255, 255, .1);
        }

        button.on {
            background: rgba(255, 255, 255, .2);
            border-color: var(--edge);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4);
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        .tw button,
        .panel label button {
            padding: 3px 14px;
            border-color: var(--edge);
        }

        .drop {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: rgba(5, 4, 10, .6);
            backdrop-filter: blur(14px);
            font-size: 24px;
            font-weight: 200;
            z-index: 9;
        }

        .dock.open {
            width: 310px;
            max-width: min(330px, calc(100vw - 36px));
        }

        .visual-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            max-height: min(52vh, 460px);
        }

        .visual-options-header {
            grid-column: 1/-1;
        }

        .visual-options button.vo {
            position: relative;
            display: block;
            padding: 4px;
            border-radius: 14px;
            white-space: normal;
        }

        .vo canvas {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            display: block;
            background: #05040a;
        }

        .vo span {
            position: absolute;
            left: 11px;
            bottom: 11px;
            max-width: calc(100% - 22px);
            padding: 3px 10px;
            font-size: 11px;
            letter-spacing: .04em;
            line-height: 1.4;
            border-radius: 999px;
            border: 1px solid var(--edge);
            background: var(--glass), rgba(10, 8, 16, .28);
            backdrop-filter: blur(14px) saturate(170%);
            -webkit-backdrop-filter: blur(14px) saturate(170%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 4px 14px rgba(0, 0, 0, .35);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            pointer-events: none;
        }

        /* ---------- Shuffle panel ---------- */
        .shuf {
            position: absolute;
            right: 18px;
            bottom: max(18px, env(safe-area-inset-bottom));
            width: 250px;
            padding: 16px 18px;
            z-index: 5;
            max-height: calc(100vh - 36px);
            overflow-y: auto;
        }

        .shuf h3 {
            font-weight: 300;
            font-size: 13px;
            color: var(--dim);
            margin-bottom: 10px;
        }

        .plist {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 6px;
        }

        .plist li {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 6px 5px 8px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, .04);
            cursor: grab;
            font-size: 13px;
            transition: background .2s, border-color .2s;
        }

        .plist li.now {
            background: linear-gradient(110deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .07));
            border-color: var(--edge);
        }

        .plist li.drag {
            opacity: .35;
        }

        .plist li.over {
            border-color: #fff;
        }

        .plist .grip {
            opacity: .4;
            letter-spacing: -.15em;
            user-select: none;
        }

        .plist .nm {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .plist button {
            padding: 0 7px;
            line-height: 1.5;
            font-size: 12px;
            border-color: var(--edge);
        }

        .plist button:disabled {
            opacity: .25;
            pointer-events: none;
        }

        .shuf label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 12px;
        }

        .shuf input[type=range] {
            width: 100%;
            accent-color: #fff;
            margin-top: 6px;
        }

        .plist li.offr .nm {
            opacity: .38;
            text-decoration: line-through;
        }

        .plist .tg {
            width: 20px;
            height: 20px;
            padding: 0;
            border-radius: 6px;
            font-size: 11px;
            line-height: 1;
        }

        .shuf label button {
            padding: 3px 14px;
            border-color: var(--edge);
        }
    </style>
</head>

<body>
    <div id="app" v-cloak>
        <div class="ui" :class="{idle}">
            <div class="top">
                <div class="brand glass">K2</div>
                <div class="status glass">{{ status }}</div>
            </div>
            <section class="panel glass" v-if="panel">
                <h3>Color</h3>
                <div class="sw"><button v-for="(pl,i) in palettes" :key="pl.name" class="swatch" :class="{on: pal===i}"
                        :style="{background: pl.css}" :title="pl.name" @click="pal=i"></button></div>
                <label>Hue shift <span>{{ Math.round(hue*360)
                        }}°</span></label>
                <input type="range" min="0" max="1" step="0.005" v-model.number="hue" aria-label="Hue shift">
                <label><span>Reduce flashing</span><button :class="{on: calm}" @click="calm=!calm">{{ calm ?
                        'On' :
                        'Off' }}</button></label>
            </section>
            <section class="meter glass">
                <svg ref="svg" viewBox="-100 -100 200 200"></svg>
                <div class="bpm"><b>{{ bpm || '—'
                        }}</b><span>BPM</span></div>
                <div class="tw"><button @click="scale(.5)" title="Halve tempo">½</button><button @click="scale(2)"
                        title="Double tempo">2×</button></div>
            </section>
            <section class="shuf glass" v-if="shuffle">
                <h3>Shuffle order</h3>
                <ol class="plist">
                    <li v-for="(n,i) in order" :key="n" draggable="true"
                        :class="{drag: dragI===i, over: overI===i && dragI!==i, now: visuals[vis].n===n, offr: off.includes(n)}"
                        @dragstart="dragStart(i,$event)" @dragover.prevent="overI=i" @drop.prevent="dropOn(i)"
                        @dragend="dragI=-1;overI=-1">
                        <button class="tg" :class="{on: !off.includes(n)}" @click="tgl(n)"
                            :title="off.includes(n) ? 'Include in shuffle' : 'Skip in shuffle'"
                            :aria-label="(off.includes(n) ? 'Include ' : 'Skip ') + n">{{ off.includes(n) ? '' : '✓'
                            }}</button>
                        <span class="grip">⋮⋮</span>
                        <span class="nm" @click="goName(n)">{{ n }}</span>
                        <button @click="mv(i,-1)" :disabled="i===0" aria-label="Move up">↑</button>
                        <button @click="mv(i,1)" :disabled="i===order.length-1" aria-label="Move down">↓</button>
                    </li>
                </ol>
                <label>
                    <span>Switching mode</span>
                    <button @click="mode = mode === 'bpm' ? 'timed' : 'bpm'">
                        {{ mode === 'bpm' ? 'BPM Change' : 'Timed' }}
                    </button>
                </label>
                <label v-if="mode === 'timed'">
                    Change every (seconds)
                </label>
                <input
                    v-if="mode === 'timed'"
                    type="number"
                    min="1"
                    max="3600"
                    step="1"
                    v-model.number="secs"
                    aria-label="Seconds per visual"
                    style="width: 100%; padding: 6px 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--edge); border-radius: 8px; color: var(--fg); font: inherit; margin-top: 4px;">
                <label>Transition (seconds)
                </label>
                <input type="number" min="0.1" max="30" step="0.1" v-model.number="fade" aria-label="Transition length"
                    style="width: 100%; padding: 6px 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--edge); border-radius: 8px; color: var(--fg); font: inherit; margin-top: 4px;">
                <label style="margin-top: 12px;"><span>Random order</span><button :class="{on: rand}"
                        @click="rand=!rand">{{ rand ? 'On' : 'Off' }}</button></label>
            </section>
            <nav class="dock glass" :class="{open:selectOpen}" aria-label="Visualizer controls and options">
                <div class="dock-controls">
                    <button class="select-button" :class="{on: selectOpen}" @click="selectOpen=true"
                        :aria-expanded="selectOpen">Select</button>
                    <button v-for="s in sources" :key="s.id" :class="{on: src===s.id}" @click="choose(s.id)">{{
                        s.label
                        }}</button>
                    <button v-if="src==='file'" @click="toggle">{{ playing ?
                        'Pause' : 'Play' }}</button>
                    <button :class="{on: panel}" @click="panel=!panel">Color</button>
                    <button :class="{on: shuffle}" @click="shuffle=!shuffle">Shuffle</button>
                    <button @click="fs" title="Fullscreen (f)">Fullscreen</button>
                </div>
                <div v-if="selectOpen" class="visual-options" aria-label="Choose a visualizer">
                    <div class="visual-options-header">
                        <span class="visual-options-title">Choose a
                            visualizer</span>
                        <button class="close-select" @click="selectOpen=false" aria-label="Close visualizer list"
                            title="Close">×</button>
                    </div>
                    <button v-for="x in shown" :key="x.n" class="vo" :class="{on: vis===x.i}" @click="setVis(x.i,1.4)">
                        <canvas class="pv" width="192" height="108" :data-i="x.i"></canvas><span>{{ x.n }}</span>
                    </button>
                </div>
            </nav>
        </div>
        <div class="drop" v-if="dropping">Drop an audio file to play it
        </div>
        <input type="file" ref="pick" accept="audio/*" hidden @change="onPick">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.17/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        // Uniforms: p = FLOW phase (speeds up with tempo), k = soft beat pulse (~2.5% brightness lift), v = volume,
        // e1/e2 = 8 frequency bands (fine detail), e3 = (slow energy, spectral centroid, onset, flashing on/off),
        // pa..pd + hue = palette, wv = row 0 smoothed waveform / row 1 spectrum
        const HEAD = `uniform vec2 r; uniform float t,p,k,v,hue,fb; uniform vec4 e1,e2,e3; uniform vec3 pa,pb,pc,pd; uniform sampler2D wv; uniform vec2 crv1[65]; uniform vec2 crv2[49];
vec3 pal(float x){ return pa+pb*cos(6.2831*(pc*(x+hue)+pd)); }
mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }
float ss(float a,float b,float x){ float q=clamp((x-a)/(b-a),0.,1.); return q*q*(3.-2.*q); }
float lnf(float x){ return .5-abs(fract(x)-.5); }
float hs(vec2 x){ return fract(sin(dot(x,vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 x){ vec2 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y); }
float fbm(vec2 x){ float a=.5, s=0.; for(float i=0.;i<4.;i++){ s+=a*vn(x); x=x*2.02+vec2(1.7,9.2); a*=.5; } return s; }
vec2 K(vec2 u,float n){ float s=6.2831853/n, a=atan(u.y,u.x)+p*.06, d=length(u); a=abs(mod(a,s)-s*.5); return d*vec2(cos(a),sin(a)); }
float glow(float d,float w,float g){ d=abs(d); return ss(w,0.,d)*1.1+g/(d+g*3.); }
float sdBox(vec2 q,vec2 b){ vec2 d=abs(q)-b; return length(max(d,0.))+min(max(d.x,d.y),0.); }
float sdPoly(vec2 q,float n,float r){ float a=atan(q.y,q.x)+3.14159265/n, s=6.2831853/n; a=mod(a,s)-s*.5; return length(q)*cos(a)-r; }
float band(float i){ return i<.5?e1.x:i<1.5?e1.y:i<2.5?e1.z:i<3.5?e1.w:i<4.5?e2.x:i<5.5?e2.y:i<6.5?e2.z:e2.w; }
float spk(vec2 u,float sc){ vec2 q=u*sc, g=floor(q), f=fract(q)-.5; float h=hs(g);
  vec2 o=(vec2(hs(g+3.1),hs(g+7.7))-.5)*.6, d=f-o; float tw=mix(.65,.5+.5*sin(p*1.5+h*40.),e3.w);
  float s=ss(.16,0.,length(d)); return step(.82,h)*s*s*tw; }
float W(float x){ return texture2D(wv,vec2(clamp(x,0.,1.),.25)).r-.5; }
float S(float x){ return texture2D(wv,vec2(clamp(x,0.,1.),.75)).r; }
vec3 fin(vec3 c,vec2 u){ c*=1.+.025*k*e3.w; c=1.-exp(-c*1.5); c=mix(vec3(dot(c,vec3(.333))),c,.92); return c*(1.-.3*dot(u,u))+.012; }
`;
        const V = [
            // ================= GLASS (translucent glass + neon edges + glow) =================
            ["Crystal", "Glass", `void main(){ vec2 uv=(gl_FragCoord.xy-.5*r)/r.y; vec3 c=vec3(0.);
  for(float i=0.;i<7.;i++){ float bi=band(i), R=.1+i*.1+.012*bi, dir=mod(i,2.)*2.-1.; vec2 q=uv*rot(dir*p*.12*(1.+i*.1)+i*.4);
    float sd=sdPoly(q,6.,R), inside=ss(.01,-.03,sd); vec3 col=pal(i*.12+v+p*.01);
    c+=col*glow(sd,.004+.002*bi,.005)*(.5+bi)+col*.05*inside*(1.+bi)+vec3(1.)*.06*inside*ss(.03,0.,abs(q.x+q.y*.6-.05*sin(p*.2+i))); }
  c+=pal(p*.02)*ss(.06,0.,length(uv))*(.4+e1.y*1.5);
  gl_FragColor=vec4(fin(c,uv),1.); }`],
            ["Panes", "Glass", `void main(){ vec2 uv=(gl_FragCoord.xy-.5*r)/r.y; vec3 c=vec3(0.);
  for(float i=0.;i<8.;i++){ float bi=band(i);
    vec2 o=.5*vec2(sin(p*.1*(1.+i*.2)+i*2.3),cos(p*.08*(1.+i*.15)+i*1.7)), b=vec2(.12+.05*hs(vec2(i,1.))+.03*bi,.18+.05*hs(vec2(i,2.)));
    vec2 q=(uv-o)*rot(.4*sin(p*.07+i)+i*.3); float sd=sdBox(q,b)-.02; vec3 col=pal(i*.13+v+p*.01);
    c+=col*(glow(sd,.003,.005)*(.5+.9*bi)+.07*ss(.01,-.03,sd))+vec3(1.)*.06*ss(.01,-.01,sd)*ss(.025,0.,abs(q.x-q.y*.5+.06*sin(p*.15+i))); }
  gl_FragColor=vec4(fin(c,uv),1.); }`],
            ["Lenses", "Glass", `void main(){ vec2 uv=(gl_FragCoord.xy-.5*r)/r.y; vec3 c=vec3(0.);

                    fragmentShader: `precision highp float; uniform sampler2D ta,tb; uniform vec2 r; uniform float m;
float hs(vec2 x){ return fract(sin(dot(x,vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 x){ vec2 i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y); }

  vec2 w=vec2(vn(c*3.+vec2(0.,m*2.5)),vn(c*3.+vec2(7.3,2.1)-m*2.5))-.5;
  vec2 ca=c*rt(.55*lm*(1.-d))*(1.-.2*lm)+w*.55*lm;

  vec3 col=mix(A,B,smoothstep(.15,.85,lm))*(1.+.14*sin(3.14159*lm));
  gl_FragColor=vec4(col,1.); }`,

                    depthWrite: false

                const blendScene = new THREE.Scene(),
                    blendMesh = new THREE.Mesh(bg.geometry, blendMat);

                let rtA, rtB;

                    renderer.setRenderTarget(null);
                    blendMat.uniforms.ta.value = rtA.texture;
                    blendMat.uniforms.tb.value = rtB.texture;
                    blendMat.uniforms.m.value = q;
                    renderer.render(blendScene, bgCam);
                    if (q >= 1) {
                        bg.material = mats[tr.to];
                        tr = null;
                        shufNext = now + secs.value * 1000;
                    }
                }

                // ---------- Frame loop ----------
                let last = performance.now(),
                    P = 0,
                    Fl = 0,
                    bpmS = 100,
                    corr = 0,
                    bassAvg = 0,
                    lastOnset = 0,
                    shownAt = 0,
                    fr = 0,
                    acc = 0,
                    df = 0;
                let Fb = 0,
                    vpk = .1,
                    en = 0,
                    cen = .5,
                    ons = 0,
                    wpk = .2;
                const L = {
                    v: 0
                },
                    lv = new Float32Array(8),
                    pk = new Float32Array(8).fill(.15),
                    EDGES = [1, 3, 8, 20, 46, 93, 186, 372, 743];
                const pl = new Float32Array(8);

                function curve(arr, n, fa, fb, ph, A, rA) {
                    const cs = Math.cos(rA),
                        sn = Math.sin(rA);
                    for (let i = 0; i <= n; i++) {
                        const t = i / n * 6.2831853;
                        let x = Math.sin(fa * t + ph) * (1 + .25 * pl[2]) + .2 * pl[5] * Math.sin((fa * 3 + 2) * t + ph * 3);
                        let y = Math.sin(fb * t + ph * .75 + 1.2) * (1 + .25 * pl[3]) + .2 * pl[6] * Math.sin((fb * 3 + 1) * t - ph * 2.5);
                        x *= A;
                        y *= A;
                        arr[i].set(x * cs - y * sn, x * sn + y * cs);
                    }
                }
                const wv = new Float32Array(1024),
                    spv = new Float32Array(1024),
                    raw = new Float32Array(1024),
                    b1 = new Float32Array(1024),
                    b2 = new Float32Array(1024),
                    pre = new Float32Array(1025);

                function blur(s, d, rad) { // box blur via prefix sums
                    pre[0] = 0;
                    for (let i = 0; i < 1024; i++) pre[i + 1] = pre[i] + s[i];
                    for (let i = 0; i < 1024; i++) {
                        const lo = Math.max(0, i - rad),
                            hi = Math.min(1024, i + rad + 1);
                        d[i] = (pre[hi] - pre[lo]) / (hi - lo);
                    }
                }
                const sm = (c, t, dt) => c + (t - c) * (1 - Math.exp(-(t > c ? (calm.value ? 6 : 18) : 5) * dt));

                function loop(now) {
                    const dt = Math.min((now - last) / 1000, .05);
                    last = now;
                    let k = .2;
                    if (an) {
                        an.getByteFrequencyData(freq);
                        an.getByteTimeDomainData(td);
                        const rb = avg(freq, 1, 8);
                        L.v = sm(L.v, avg(freq, 1, 300), dt);
                        for (let i = 0; i < 8; i++) {
                            const x = avg(freq, EDGES[i], EDGES[i + 1]);
                            pk[i] = Math.max(pk[i] * (1 - dt * .05), x, .05);
                            lv[i] = sm(lv[i], Math.pow(Math.min(1, x / pk[i]), 1.5), dt);
                        }
                        vpk = Math.max(vpk * (1 - dt * .03), L.v, .05);
                        en += (Math.min(1, L.v / vpk) - en) * (1 - Math.exp(-dt * .6));
                        let sw = 0,
                            sx = 0;
                        for (let i = 1; i < 400; i++) {
                            sw += freq[i];
                            sx += freq[i] * i;
                        }
                        cen += (Math.min(1, Math.max(0, Math.log((sw > 0 ? sx / sw : 30) / 8) / Math.log(25))) - cen) * (1 - Math.exp(-dt * 1.2));
                        bassAvg += (rb - bassAvg) * .03;
                        ons = sm(ons, Math.min(1, Math.max(0, (rb - bassAvg) * 4)), dt);
                        const target = (info ? info.bpm : (liveBpm || 100)) * mul;
                        bpmS += (target - bpmS) * (1 - Math.exp(-dt * 1.5));
                        if (info) {
                            if (info.run()) {
                                const tp = (info.clock() - info.off) * target / 60,
                                    err = tp - P;
                                if (Math.abs(err) > .75) P = tp;
                                else P += dt * bpmS / 60 + err * (1 - Math.exp(-dt * 2));
                            }
                        } else {
                            P += dt * bpmS / 60;
                            if (liveBpm && rb > bassAvg * 1.25 + .05 && now - lastOnset > 180) {
                                lastOnset = now;
                                const f0 = P - Math.floor(P);
                                corr -= (f0 > .5 ? f0 - 1 : f0) * .2;
                            }
                            const a = corr * (1 - Math.exp(-dt * 8));
                            P += a;
                            corr -= a;
                        }
                        const f = P - Math.floor(P);
                        k = Math.pow(.5 + .5 * Math.cos(6.2831853 * f), 4);
                        if (!info || info.run()) Fb += dt * k * (calm.value ? 0 : 1) * (bpmS / 60) * (bpmS / 120) * 1.5;
                        if (!info || info.run()) Fl += dt * (bpmS / 60) * (bpmS / 120) * 1.5;
                        if (now - shownAt > 400) {
                            shownAt = now;
                            bpm.value = (info || liveBpm) ? Math.round(target) : 0;
                        }
                        for (let i = 0; i < NB; i++) {
                            const a = Math.round(2 * Math.pow(200, i / NB)),
                                c2 = Math.max(a + 1, Math.round(2 * Math.pow(200, (i + 1) / NB)));
                            bands[i] = sm(bands[i], avg(freq, a, c2), dt);
                        }
                        // waveform: trigger on a rising zero-crossing, low-pass twice (removes the fast buzz), normalise, then glide over time
                        let st = 0;
                        for (let i = 0; i < 1000; i++)
                            if (td[i] < 128 && td[i + 1] >= 128) {
                                st = i;
                                break;
                            }
                        for (let j = 0; j < 1024; j++) raw[j] = (td[st + j] - 128) / 128;
                        blur(raw, b1, 16);
                        blur(b1, b2, 16);
                        let mx = 0;
                        for (let j = 0; j < 1024; j++) mx = Math.max(mx, Math.abs(b2[j]));
                        wpk = Math.max(wpk * (1 - dt * .3), mx, .015);
                        const wk = 1 - Math.exp(-dt * 7);
                        for (let j = 0; j < 1024; j++) {
                            const o = Math.min(1, Math.max(0, .5 + b2[j] / (.15 + .85 * wpk) * .4));
                            wv[j] += (o - wv[j]) * wk;
                            texData[j] = Math.round(wv[j] * 255);
                            spv[j] = sm(spv[j], Math.min(1, freq[j] / 255 * (1 + j / 400)), dt);
                            texData[1024 + j] = Math.round(spv[j] * 255);
                        }
                    } else { // idle: gentle drift + calm test pattern
                        Fl = now / 1000 * 1.2;
                        L.v = .12;
                        en = .3;
                        cen = .5;
                        ons = 0;
                        for (let i = 0; i < 8; i++) lv[i] = .2 + .1 * Math.sin(now / 1000 + i);
                        for (let j = 0; j < 1024; j++) {
                            texData[j] = Math.round(255 * (.5 + .16 * Math.sin(j / 1024 * 18.85 + now / 700) * Math.sin(j / 1024 * 3.14)));
                            texData[1024 + j] = Math.round(255 * (.3 + .2 * Math.sin(j / 40 + now / 900)));
                        }
                    }
                    tex.needsUpdate = true;
                    if (visuals[vis.value].n === "Phase") {
                        for (let i = 0; i < 8; i++) pl[i] += (lv[i] - pl[i]) * (1 - Math.exp(-dt * 3));
                        const A = .34 + .05 * pl[1] + .04 * en;
                        curve(U.crv1.value, 64, 3, 2, Fl * .2, A, Fl * .05);
                        curve(U.crv2.value, 48, 5, 4, Fl * .13 + 1, A * .6, -Fl * .07);
                    }
                    U.t.value = now / 1000;
                    U.p.value = Fl;
                    U.fb.value = Fb;
                    U.k.value = k;
                    U.v.value = L.v;
                    U.hue.value = hue.value + (cen - .5) * (calm.value ? .1 : .25);
                    U.e1.value.set(lv[0], lv[1], lv[2], lv[3]);
                    U.e2.value.set(lv[4], lv[5], lv[6], lv[7]);
                    U.e3.value.set(en, cen, ons, calm.value ? 0 : 1);
                    renderMain(now);
                    renderPv();
                    if ((df++ & 1) === 0) drawBands(k);
                    acc += dt;
                    if (++fr === 90) {
                        if (acc / 90 > .028 && pr > .75) {
                            pr = Math.max(.75, pr * .88);
                            resize();
                        }
                        fr = 0;
                        acc = 0;
                    }
                    requestAnimationFrame(loop);
                }

                onMounted(() => {
                    const s = d3.select(svg.value);
                    ring2 = s.append("circle").attr("class", "ring");
                    gBars = s.append("g");
                    let t;
                    const wake = () => {
                        idle.value = false;
                        clearTimeout(t);
                        t = setTimeout(() => {
                            idle.value = !!an && !panel.value;
                        }, 3500);
                    };
                    ["mousemove", "keydown", "touchstart", "click"].forEach(ev => addEventListener(ev, wake));
                    wake();
                    addEventListener("keydown", e => {
                        if (e.key === "f") fs();
                        if (/^[1-9]$/.test(e.key)) {
                            const x = shown.value[+e.key - 1];
                            if (x) setVis(x.i);
                        }
                        const n = visuals.length;
                        if (e.key === "ArrowRight") setVis((vis.value + 1) % n);
                        if (e.key === "ArrowLeft") setVis((vis.value + n - 1) % n);
                    });
                    addEventListener("dragover", e => {
                        e.preventDefault();
                        dropping.value = true;
                    });
                    addEventListener("dragleave", e => {
                        if (!e.relatedTarget) dropping.value = false;
                    });
                    addEventListener("drop", e => {
                        e.preventDefault();
                        dropping.value = false;
                        const f = e.dataTransfer.files[0];
                        if (f && f.type.startsWith("audio")) playFile(f);
                    });
                    requestAnimationFrame(loop);
                });
                return {
                    sources,
                    shown,
                    visuals,
                    palettes: PALS,
                    src,
                    status,
                    bpm,
                    vis,
                    idle,
                    playing,
                    dropping,
                    panel,
                    selectOpen,
                    pal,
                    hue,
                    calm,
                    svg,
                    pick,
                    choose,
                    onPick,
                    toggle,
                    setVis,
                    fs,
                    scale,
                    shuffle,
                    order,
                    secs,
                    rand,
                    mode,
                    dragI,
                    overI,
                    dragStart,
                    dropOn,
                    mv,
                    goName,
                    off,
                    fade,
                    tgl
                };
            }
        }).mount("#app");
    </script>
</body>
